name: PayFlex CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Unit tests, coverage and secrets detection
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests and coverage
        run: python scripts/quality_gate.py

      - name: Detect secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. API integration tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Newman
        run: npm ci

      - name: Start API with Docker Compose
        run: docker compose up -d --build --wait

      - name: Run Newman integration tests
        run: |
          mkdir -p reports
          npx newman run postman/payflex_collection.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/integration-report.html

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: reports/integration-report.html
          if-no-files-found: ignore

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  # 3. Performance tests
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration
    outputs:
      k6-outcome: ${{ steps.k6.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start API
        run: docker compose up -d --build --wait

      - name: Run k6 load test
        id: k6
        continue-on-error: true
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/performance:/scripts" \
            grafana/k6:latest run /scripts/load_test_failure.js

      - name: Report performance warning
        if: steps.k6.outcome == 'failure'
        run: echo "::warning::Performance tests failed. Check the k6 thresholds and report."

      - name: Stop Docker Compose
        if: always()
        run: docker compose down

  # 4. Incident report when a critical job fails
  incident-report:
    name: Incident Report
    runs-on: ubuntu-latest
    needs: [quality, integration, performance]
    if: always()

    steps:
      - name: Generate incident report
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          K6_OUTCOME: ${{ needs.performance.outputs.k6-outcome }}
        run: |
          mkdir -p reports

          {
            echo "PayFlex CI Pipeline - Execution Report"
            echo "Date: $(date -u)"
            echo ""
            echo "Quality Gate: $QUALITY_RESULT"
            echo "Integration Tests: $INTEGRATION_RESULT"
            echo "Performance Tests: $PERFORMANCE_RESULT"
            echo ""

            if [ "$QUALITY_RESULT" = "failure" ] || [ "$INTEGRATION_RESULT" = "failure" ]; then
              echo "Classification: CRITICAL FAILURE"
              echo "Pipeline status: FAILED"
            elif [ "$PERFORMANCE_RESULT" = "failure" ]; then
              echo "Classification: NON-CRITICAL FAILURE"
              echo "Pipeline status: WARNING"
            else
              echo "Classification: NO FAILURE DETECTED"
            fi
          } > reports/incident-report.txt

          cat reports/incident-report.txt

      - name: Upload incident report
        uses: actions/upload-artifact@v4
        with:
          name: incident-report
          path: reports/incident-report.txt
