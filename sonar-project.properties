
sonar.projectKey=payflex-devops
sonar.projectName=PayFlex

# Python source code
sonar.sources=app
sonar.tests=tests

# Python version
sonar.python.version=3.12

# Coverage report generated by pytest
sonar.python.coverage.reportPaths=reports/coverage.xml

# Exclude generated files and dependencies
sonar.exclusions=**/__pycache__/**,**/venv/**,**/node_modules/**,**/.pytest_cache/**,**/htmlcov/**,**/reports/**

# Test files
sonar.test.inclusions=tests/**/*.py

sonar.sourceEncoding=UTF-8
